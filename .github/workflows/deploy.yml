name: Deploy

on:
  # Run this workflow whenever a new commit is pushed to main.
  push: {branches: [main]}
  # Run this workflow once per day, at 10:15 UTC
  schedule: [{cron: "0 12 * * *"}]
  # Run this workflow when triggered manually in GitHub’s UI.
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      PMEL_CCE1_USERNAME: ${{ secrets.PMEL_CCE1_USERNAME }}
      PMEL_CCE1_PASSWORD: ${{ secrets.PMEL_CCE1_PASSWORD }}
      PMEL_CCE2_USERNAME: ${{ secrets.PMEL_CCE2_USERNAME }}
      PMEL_CCE2_PASSWORD: ${{ secrets.PMEL_CCE2_PASSWORD }}
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: python src/data/ENSO_alert_status.json.py > src/data/ENSO_alert_status.json
      - run: python src/data/shore_station_anomaly.zip.py > src/data/shore_station_anomaly.zip
      - run: npm ci
      - run: npm run build
      - uses: actions/configure-pages@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
